name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Ключ подписи берётся из секретов репозитория. В сборках из форков секретов нет,
      # тогда релиз подписывается отладочным ключом.
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан, подпись отладочным ключом"
          fi

      - name: Собрать debug и release
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Собрать файлы
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/MaterialLauncher-debug.apk
          cp app/build/outputs/apk/release/*.apk out/MaterialLauncher-release.apk

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: MaterialLauncher-apk
          path: out/*.apk

      # Релиз создаётся только по тегу вида v3.1
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/MaterialLauncher-release.apk out/MaterialLauncher-debug.apk \
            --title "Material Launcher ${GITHUB_REF_NAME#v}" \
            --notes "Установите MaterialLauncher-release.apk. Список изменений: CHANGELOG.md"
